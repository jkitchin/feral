[workspace]
resolver = "3"

[package]
name = "feral-python"
version = "0.25.0"
# Edition 2021 on purpose (issue #147): pyo3 0.22's #[pymethods] and
# #[pyfunction] expansions are not 2024-clean (~190 unsafe_op_in_unsafe_fn
# warnings from macro-generated code). Revisit with a pyo3 upgrade.
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Python bindings for feral — sparse symmetric indefinite direct solver."
authors = ["John Kitchin <jkitchin@andrew.cmu.edu>"]
repository = "https://github.com/jkitchin/feral"
publish = false

[lib]
name = "_feral"
crate-type = ["cdylib"]

[dependencies]
feral = { path = ".." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
