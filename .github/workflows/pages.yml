name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deploy; cancel in-progress runs on new pushes so we
# do not race to publish stale output.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build book
        run: mdbook build book
      - name: build rustdoc
        # --no-deps keeps the artifact small and avoids dragging in transitive
        # crate docs that no one navigates to from feral's site.
        run: cargo doc --workspace --no-deps --lib
      - name: assemble site
        # Book at the site root; rustdoc nested under /api/. The api.md page
        # in the book links into this subtree.
        run: |
          mkdir -p site
          cp -R book/book/. site/
          mkdir -p site/api
          cp -R target/doc/. site/api/
          # Landing redirect inside /api/ so /api/ resolves to a useful page
          # (rustdoc does not emit one by default).
          printf '<meta http-equiv="refresh" content="0; url=feral/index.html">\n' > site/api/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
